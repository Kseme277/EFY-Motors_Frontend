<app-header></app-header>

<section class="inner-page-hero" style="background: #0c111d;">
  <div class="containers">
    <div class="row">
      <div class="col-md-10">
        <h1 class="text-white hero-title">Contactez-nous</h1>
      </div>
    </div>
  </div>
</section>
<section class="contact-main">
  <div class="container">
    <div class="contact-card">
      <h2>CONTACTEZ-NOUS</h2>
      <form (ngSubmit)="onSubmit()" #form="ngForm">
        <div *ngIf="successMessage" class="alert-message success">{{ successMessage }}</div>
        <div *ngIf="errorMessage" class="alert-message error">{{ errorMessage }}</div>

        <div class="form-grid">
          <div class="form-group">
            <label>Nom complet*</label>
            <input type="text" [(ngModel)]="contactForm.name" name="name" required placeholder="Entrez votre nom complet">
          </div>
          <div class="form-group">
            <label>Email*</label>
            <input type="email" [(ngModel)]="contactForm.email" name="email" required placeholder="email@domaine.com">
          </div>
          <div class="form-group">
            <label>Sujet*</label>
            <input type="text" [(ngModel)]="contactForm.subject" name="subject" required placeholder="Objet de votre message">
          </div>
          <div class="form-group form-message">
            <label>Message*</label>
            <textarea [(ngModel)]="contactForm.message" name="message" required rows="4" placeholder="Entrez votre message..."></textarea>
          </div>
        </div>

        <div class="submit-row">
          <button type="submit" [disabled]="isLoading" class="submit-btn">
            <span *ngIf="!isLoading">ENVOYER</span>
            <span *ngIf="isLoading">ENVOI...</span>
          </button>
        </div>
      </form>
    </div>

    <div class="contact-bottom-grid">
      <div class="contact-infos">
        <div class="info-tabs">
          <button class="active" type="button">BUREAU</button>
          <button type="button">VENTES</button>
          <button type="button">SERVICE</button>
        </div>

        <div class="info-item">
          <h4>Adresse</h4>
          <p>Quartier Bastos, Rue de l'Ambassade, Yaoundé</p>
        </div>
        <div class="info-item">
          <h4>Téléphone</h4>
          <p><a href="tel:+237697364696">+237 697 364 696</a></p>
        </div>
        <div class="info-item">
          <h4>Horaires</h4>
          <p>Lundi - Samedi : 08h00 - 18h00</p>
        </div>
      </div>

      <div class="map-wrap">
        <iframe 
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d127314.1234567890!2d11.5021!3d3.8480!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x108bcf7b8c0b0b0b%3A0x0!2sYaound%C3%A9!5e0!3m2!1sfr!2scm!4v1234567890123!5m2!1sfr!2scm" 
          width="100%" 
          height="100%" 
          style="border:0;" 
          allowfullscreen="" 
          loading="lazy" 
          title="Localisation EFY Motors">
        </iframe>
      </div>
    </div>
  </div>
</section>

<app-footer></app-footer>
