<div class="admin-container">
  <!-- Overlay pour mobile -->
  <div class="sidebar-overlay" *ngIf="isMobileMenuOpen" (click)="closeSidebar()"></div>
  
  <!-- Sidebar -->
  <aside class="admin-sidebar" [class.collapsed]="!isSidebarOpen" [class.open]="isMobileMenuOpen">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-circle">
          <img src="assets/images/logo.png" alt="EFY Motors" class="logo-img">
        </div>
        <div class="logo-text">
        <h2>EFY Motors</h2>
        <span class="logo-subtitle">Admin Panel</span>
        </div>
      </div>
      <button class="sidebar-close-btn" (click)="closeSidebar()" *ngIf="isMobileMenuOpen" aria-label="Fermer le menu">
        <span class="ion-ios-close"></span>
      </button>
    </div>
    
    <nav class="sidebar-nav">
      <a routerLink="/admin/dashboard" routerLinkActive="active" class="nav-item">
        <span class="nav-icon ion-ios-speedometer"></span>
        <span class="nav-text">Dashboard</span>
      </a>
      <a routerLink="/admin/vehicles" routerLinkActive="active" class="nav-item">
        <span class="nav-icon ion-ios-car"></span>
        <span class="nav-text">Véhicules</span>
      </a>
      <a routerLink="/admin/requests" routerLinkActive="active" class="nav-item">
        <span class="nav-icon ion-ios-mail"></span>
        <span class="nav-text">Demandes</span>
      </a>
    </nav>
    
    <div class="sidebar-footer">
      <button (click)="goToLogin()" class="login-button">
        <span class="ion-ios-log-out"></span>
        <span>Déconnexion</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="admin-main">
    <header class="admin-header">
      <div class="header-left">
        <button class="sidebar-toggle-btn" (click)="toggleSidebar()" [attr.aria-label]="isSidebarOpen ? 'Réduire la sidebar' : 'Agrandir la sidebar'">
          <span class="ion-ios-menu"></span>
        </button>
        <h1 class="page-title">{{ getPageTitle() }}</h1>
      </div>
    </header>
    
    <div class="admin-content">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
