<div class="login-container">
  <div class="background">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
    <div class="logo-section">
      <div class="logo-circle">
        <img src="assets/images/logo.png" alt="EFY Motors" class="logo-img">
      </div>
      <h3>EFY Motors</h3>
      <p class="subtitle">Espace Administrateur</p>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input 
        type="email" 
        id="email" 
        formControlName="email"
        placeholder="admin@efymotors.com"
        [class.error]="email?.invalid && email?.touched"
        autocomplete="email">
      <span class="error-message" *ngIf="email?.invalid && email?.touched">
        <span *ngIf="email?.errors?.['required']">L'email est requis</span>
        <span *ngIf="email?.errors?.['email']">Format d'email invalide</span>
      </span>
    </div>

    <div class="form-group">
      <label for="password">Mot de passe</label>
      <input 
        type="password" 
        id="password" 
        formControlName="password"
        placeholder="••••••••"
        [class.error]="password?.invalid && password?.touched"
        autocomplete="current-password">
      <span class="error-message" *ngIf="password?.invalid && password?.touched">
        <span *ngIf="password?.errors?.['required']">Le mot de passe est requis</span>
        <span *ngIf="password?.errors?.['minlength']">Minimum 6 caractères</span>
      </span>
    </div>

    <div class="error-message server-error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <button type="submit" [disabled]="isLoading" class="login-button">
      <span *ngIf="!isLoading">Se connecter</span>
      <span *ngIf="isLoading" class="loading">
        <span class="spinner"></span>
        Connexion en cours...
      </span>
    </button>
  </form>
</div>
