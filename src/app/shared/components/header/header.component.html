<nav class="navbar navbar-expand-lg navbar-dark ftco_navbar ftco-navbar-light fixed-top" 
     [class.scrolled]="isScrolled" 
     id="ftco-navbar">
  <div class="container px-md-3">
    <!-- Logo à gauche -->
    <a class="navbar-brand" routerLink="/">
      <img src="assets/images/logo.png" alt="EFY Motors" class="logo-img">
    </a>

    <div class="d-flex align-items-center order-lg-last">
      <button class="navbar-toggler" type="button" (click)="toggleOffcanvas()" aria-label="Toggle navigation">
        <span class="oi oi-menu"></span>
      </button>
    </div>

    <!-- Menu centré -->
    <div class="collapse navbar-collapse justify-content-center" id="ftco-nav">
      <ul class="navbar-nav mx-auto align-items-center">
        <li class="nav-item">
          <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">Accueil</a>
        </li>
        <li class="nav-item">
          <a routerLink="/about" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">À propos</a>
        </li>
        <li class="nav-item">
          <a routerLink="/services" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">Services</a>
        </li>
        <li class="nav-item">
          <a routerLink="/cars" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}" class="nav-link">Véhicules</a>
        </li>
        <li class="nav-item">
          <a routerLink="/contact" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">Contact</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Mobile Offcanvas Backdrop -->
<div class="fixed inset-0 bg-black/70 z-[1040] transition-opacity duration-300" 
     [class.opacity-0]="!isOffcanvasOpen" 
     [class.pointer-events-none]="!isOffcanvasOpen"
     (click)="closeOffcanvas()">
</div>

<!-- Mobile Offcanvas Menu -->
<div class="fixed top-0 right-0 h-full w-[300px] max-w-[80vw] bg-[#0c111d] z-[1050] transform transition-transform duration-300 shadow-2xl flex flex-col"
     [class.translate-x-full]="!isOffcanvasOpen"
     [class.translate-x-0]="isOffcanvasOpen">
  
  <!-- Header -->
  <div class="p-6 flex justify-between items-center border-b border-gray-800">
    <img src="assets/images/logo.png" alt="EFY Motors" class="h-16 w-16 bg-white rounded-full p-2 shadow-lg">
    <button (click)="closeOffcanvas()" class="text-white hover:text-[#fb6514] focus:outline-none">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>
  
  <!-- Links -->
  <div class="p-6 flex flex-col gap-6 overflow-y-auto mt-4">
    <a routerLink="/" routerLinkActive="active-offcanvas-link" [routerLinkActiveOptions]="{exact: true}" (click)="closeOffcanvas()" class="offcanvas-link text-xl font-bold transition-colors flex items-center" style="color: #ffffff !important;">Accueil</a>
    <a routerLink="/about" routerLinkActive="active-offcanvas-link" (click)="closeOffcanvas()" class="offcanvas-link text-xl font-bold transition-colors flex items-center" style="color: #ffffff !important;">À propos</a>
    <a routerLink="/services" routerLinkActive="active-offcanvas-link" (click)="closeOffcanvas()" class="offcanvas-link text-xl font-bold transition-colors flex items-center" style="color: #ffffff !important;">Services</a>
    <a routerLink="/cars" routerLinkActive="active-offcanvas-link" [routerLinkActiveOptions]="{exact: false}" (click)="closeOffcanvas()" class="offcanvas-link text-xl font-bold transition-colors flex items-center" style="color: #ffffff !important;">Véhicules</a>
    <a routerLink="/contact" routerLinkActive="active-offcanvas-link" (click)="closeOffcanvas()" class="offcanvas-link text-xl font-bold transition-colors flex items-center" style="color: #ffffff !important;">Contact</a>
  </div>
  
  <!-- Footer Mobile Menu -->
  <div class="mt-auto p-6 border-t border-gray-800">
    <a href="tel:+237697364696" class="offcanvas-link flex items-center gap-3 transition-colors mb-4" style="color: #ffffff !important;">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" /></svg>
      <span>+237 697 364 696</span>
    </a>
    <a href="mailto:contact@efymotors.com" class="offcanvas-link flex items-center gap-3 transition-colors" style="color: #ffffff !important;">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
      <span class="text-sm">contact@efymotors.com</span>
    </a>
  </div>
</div>
